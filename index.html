<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SISTEMA I.A - Double Blaze</title>

<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{background:#020617;font-family:Arial,sans-serif;color:#e5e7eb;overflow:hidden}

canvas{position:fixed;inset:0;z-index:0}

#statsText{position:fixed;top:5px;left:6px;font-size:10px;color:#00ff88;z-index:999;}

#app{
position:relative;
z-index:1;
max-width:420px;
height:100vh;
margin:auto;
padding:6px;
display:flex;
flex-direction:column;
gap:6px;
text-align:center;
}

.titulo{font-size:20px;font-weight:900;color:#ff0033}
.versao{font-size:13px;font-weight:900;color:#ff0033;margin-top:-4px}
.blue-neon{text-shadow:0 0 6px #3b82f6}

#hora{font-size:14px}

#placar{display:flex;justify-content:space-between;font-size:12px;}
.green-neon{color:#22c55e}
.red-neon{color:#ef4444}
.white-neon{color:#facc15}

#linha{
display:flex;
gap:4px;
overflow-x:auto;
font-size:18px;
padding:4px;
}
#linha::-webkit-scrollbar{display:none}

#botoes{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:6px;
}

button{
padding:10px;
font-size:16px;
font-weight:bold;
border:none;
border-radius:10px;
}

.red{background:#7f1d1d;color:#fff}
.black{background:#020617;color:#fff;border:1px solid #555}
.white{background:#fff;color:#020617}

#result{
min-height:50px;
font-size:15px;
font-weight:bold;
text-align:center;
}

.green-chamativo{
font-size:32px;
font-weight:900;
color:#00ff55;
text-shadow:0 0 15px #00ff55,0 0 30px #00ff55;
}

.green-branco-chamativo{
font-size:32px;
font-weight:900;
color:#00ffcc;
text-shadow:0 0 15px #00ffcc,0 0 30px #00ffcc;
}
</style>
</head>

<body>

<div id="statsText">Sinais: <span id="totalSinais">0</span> | Assert: <span id="percentual">0%</span></div>

<canvas id="matrix"></canvas>

<div id="app">
  <div>
    <div class="titulo">SISTEMA I.A</div>
    <div class="versao">V:9.60 MOBILE</div>
    <div id="hora" class="blue-neon">🕒 --:--:--</div>
  </div>

  <div id="placar">
    <span class="green-neon">GREEN <b id="greens">0</b></span>
    <span class="red-neon">LOSS <b id="losses">0</b></span>
    <span class="white-neon">BRANCO <b id="brancos">0</b></span>
  </div>

  <div id="linha"></div>

  <div id="botoes">
    <button class="red" onclick="add('R')">🔴</button>
    <button class="black" onclick="add('B')">⚫</button>
    <button class="white" onclick="add('W')">⚪</button>
  </div>

  <div id="result">⏸️ AGUARDAR</div>
</div>

<script>

/* ================= MATRIX ================= */

const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

function resize(){
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
}
resize();
window.onresize = resize;

const letters = "01アイウエオ";
const fontSize = 14;
let drops = Array(Math.floor(window.innerWidth / fontSize)).fill(1);

function drawMatrix(){
ctx.fillStyle = "rgba(2,6,23,0.35)";
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.fillStyle = "#ff0033";
ctx.font = fontSize + "px monospace";

for(let i=0;i<drops.length;i++){
let text = letters[Math.floor(Math.random()*letters.length)];
ctx.fillText(text, i*fontSize, drops[i]*fontSize);

if(drops[i]*fontSize > canvas.height && Math.random()>0.975){
drops[i]=0;
}
drops[i]++;
}
}
setInterval(drawMatrix,50);


/* ================= HORA BRASIL ================= */

function atualizarHora(){
const agora = new Date().toLocaleString("pt-BR", {
timeZone: "America/Sao_Paulo"
});

document.getElementById("hora").innerText = "🕒 " + agora + " (Brasília)";
}

setInterval(atualizarHora,1000);
atualizarHora();


/* ================= SISTEMA ================= */

const linha=document.getElementById("linha");
const result=document.getElementById("result");

let seq=[];
let sinal=null;
let gale=0;

let greens=0;
let losses=0;
let brancos=0;
let totalSinais=0;

function add(c){

seq.push(c);

const el=document.createElement("span");
el.innerText=c==="R"?"🔴":c==="B"?"⚫":"⚪";

linha.appendChild(el);
linha.scrollLeft=linha.scrollWidth;

sinal ? validar(c) : analisar();

}

function analisar(){

let ult5 = seq.slice(-5).join("");

const padroes=[
{p:"RBBRB",s:"R"},
{p:"RBBBB",s:"B"},
{p:"BRRRR",s:"B"},
{p:"BRBRR",s:"R"},
{p:"BBBRR",s:"B"},
{p:"BBBBR",s:"R"},
{p:"RRBBB",s:"B"},
{p:"BBRRB",s:"B"}
];

for(let p of padroes){

if(ult5===p.p){

sinal=p.s;
totalSinais++;

document.getElementById("totalSinais").innerText=totalSinais;

result.innerHTML=`📡 Apostar no ${sinal==="R"?"🔴":"⚫"} (G1 + Branco)`;

return;

}

}

}

function validar(c){

if(c===sinal){

greens++;
result.innerHTML="<div class='green-chamativo'>🟢 GREEN</div>";

resetar();

}else{

if(gale===0){
gale=1;
result.innerHTML="♻️ G1";
}else{
losses++;
result.innerHTML="❌ LOSS";
resetar();
}

}

}

function resetar(){
setTimeout(()=>{
sinal=null;
gale=0;
result.innerHTML="⏸️ AGUARDAR";
},1200);
}


/* ================= API AUTOMÁTICA ================= */

let ultimoId = null;

async function puxarBlaze(){

const urls = [
"https://api.codetabs.com/v1/proxy?quest=https://blaze.com/api/roulette_games/recent",
"https://api.allorigins.win/raw?url=https://blaze.com/api/roulette_games/recent"
];

for(let url of urls){

try{

let res = await fetch(url);
let data = await res.json();

if(!data || data.length === 0) continue;

let ultimo = data[0];

if(ultimo.id === ultimoId) return;

ultimoId = ultimo.id;

let cor;

if(ultimo.color === 1) cor = "R";
else if(ultimo.color === 2) cor = "B";
else cor = "W";

add(cor);
return;

}catch(e){}

}

}

setInterval(puxarBlaze, 3000);

</script>

</body>
</html>
