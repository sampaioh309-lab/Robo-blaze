<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SISTEMA I.A - Double Blaze</title>

<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{background:#020617;font-family:Arial;color:#e5e7eb;overflow:hidden}

/* ===== MATRIX ===== */
canvas{position:fixed;inset:0;z-index:0}

/* ===== APP ===== */
#app{position:relative;z-index:1;max-width:420px;height:100vh;margin:auto;padding:6px;display:flex;flex-direction:column;gap:6px;text-align:center;}

.titulo{font-size:20px;font-weight:900;color:#ff0033}

/* ===== PLACAR ===== */
#placar{display:flex;justify-content:space-between;font-size:12px;}
.green-neon{color:#22c55e}
.red-neon{color:#ef4444}
.white-neon{color:#facc15}

/* ===== HISTÓRICO ===== */
#linha{display:flex;gap:4px;overflow-x:auto;font-size:18px;padding:4px;}
#linha::-webkit-scrollbar{display:none}

/* ===== BOTÕES ===== */
#botoes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
button{padding:10px;font-size:16px;font-weight:bold;border:none;border-radius:10px;}

.red{background:#7f1d1d;color:#fff}
.black{background:#020617;color:#fff;border:1px solid #555}
.white{background:#fff;color:#020617}
.undo{background:#444;color:#fff}

/* ===== RESULTADO ===== */
#result{min-height:50px;font-size:15px;font-weight:bold}

/* ===== NEON PULSANTE ===== */
@keyframes pulseGlow{
0%{transform:scale(1);text-shadow:0 0 5px currentColor;}
50%{transform:scale(1.2);text-shadow:0 0 20px currentColor,0 0 40px currentColor;}
100%{transform:scale(1);text-shadow:0 0 5px currentColor;}
}

.neon{animation:pulseGlow 0.8s infinite;font-weight:900}

.green-big{color:#00ff55;font-size:34px}
.red-big{color:#ff0033;font-size:34px}
.white-big{color:#00ffcc;font-size:34px}

/* ===== BOLINHA PULSANDO ===== */
@keyframes pulseBall{
0%{transform:scale(1)}
50%{transform:scale(1.3)}
100%{transform:scale(1)}
}
.last-ball{animation:pulseBall 0.6s infinite}

/* ===== HORÁRIOS ===== */
#horariosBranco{font-size:12px;color:#00ffcc}

</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div id="app">

<div class="titulo">SISTEMA I.A</div>

<div id="placar">
<span class="green-neon">GREEN <b id="greens">0</b></span>
<span class="red-neon">LOSS <b id="losses">0</b></span>
<span class="white-neon">BRANCO <b id="brancos">0</b></span>
</div>

<div id="linha"></div>

<div id="botoes">
<button class="red" onclick="add('R')">🔴</button>
<button class="black" onclick="add('B')">⚫</button>
<button class="white" onclick="add('W')">⚪</button>
<button class="undo" onclick="desfazer()">↩️</button>
</div>

<div id="result">⏸️ AGUARDAR</div>
<div id="horariosBranco"></div>

</div>

<script>

/* ===== VARIÁVEIS ===== */
let seq=[], sinal=null, gale=0;
let greens=0, losses=0, brancos=0;

let horariosBranco=[], janelaInicio=null, janelaFim=null;

const linha=document.getElementById("linha");
const result=document.getElementById("result");

/* ===== PLACAR ===== */
function atualizarPlacar(){
greensEl.innerText=greens;
lossesEl.innerText=losses;
brancosEl.innerText=brancos;
}
const greensEl=document.getElementById("greens");
const lossesEl=document.getElementById("losses");
const brancosEl=document.getElementById("brancos");

/* ===== HORÁRIOS ===== */
function gerarHorariosBranco(){
horariosBranco=[];

let agora=new Date();
let base=new Date(agora.getTime()+5*60000);

for(let i=0;i<4;i++){
let futuro=new Date(base.getTime()+i*3*60000);

let h=futuro.getHours().toString().padStart(2,'0');
let m=futuro.getMinutes().toString().padStart(2,'0');

horariosBranco.push(`${h}:${m}`);
}

janelaInicio=new Date(base.getTime()-60000);
janelaFim=new Date(base.getTime()+(3*3*60000)+60000);

document.getElementById("horariosBranco").innerHTML=
"⚪ Possíveis Brancos:<br>"+horariosBranco.join(" | ");
}

/* ===== ADD ===== */
function add(c){

// remove animação antiga
document.querySelectorAll("#linha span").forEach(e=>e.classList.remove("last-ball"));

const el=document.createElement("span");
el.innerText=c==="R"?"🔴":c==="B"?"⚫":"⚪";
el.classList.add("last-ball");

linha.appendChild(el);
linha.scrollLeft=linha.scrollWidth;

seq.push(c);

/* ===== BRANCO PARALELO ===== */
if(c==="W"){
brancos++;

let agora=new Date();

if(janelaInicio && agora>=janelaInicio && agora<=janelaFim){
result.innerHTML += "<br><span class='neon white-big'>⚪ GREEN POSSÍVEL BRANCO</span>";
}

gerarHorariosBranco();
}

/* ===== ESTRATÉGIA PRINCIPAL ===== */
sinal ? validar(c) : analisar();

}

/* ===== ANALISAR ===== */
function analisar(){
let ult5=seq.slice(-5).join("");

const padroes=[
{p:"RBBRB",s:"R"},
{p:"RBBBB",s:"B"},
{p:"BRRRR",s:"B"},
{p:"BRBRR",s:"R"},
{p:"BBBRR",s:"B"},
{p:"BBBBR",s:"R"},
{p:"RRBBB",s:"B"},
{p:"BBRRB",s:"B"}
];

for(let p of padroes){
if(ult5===p.p){
sinal=p.s;
result.innerHTML=`📡 Apostar no ${sinal==="R"?"🔴":"⚫"}<br>🎯 Proteção: ⚪`;
return;
}
}
}

/* ===== VALIDAR ===== */
function validar(c){

if(c===sinal){
greens++;
result.innerHTML="<div class='neon green-big'>🟢 GREEN</div>";
atualizarPlacar();
resetar();
return;
}

if(c==="W"){
greens++;
result.innerHTML="<div class='neon white-big'>⚪ GREEN BRANCO</div>";
atualizarPlacar();
resetar();
return;
}

if(gale===0){
gale=1;
result.innerHTML="♻️ G1";
}else{
losses++;
result.innerHTML="<div class='neon red-big'>❌ LOSS</div>";
atualizarPlacar();
resetar();
}
}

function resetar(){
setTimeout(()=>{
sinal=null;
gale=0;
result.innerHTML="⏸️ AGUARDAR";
},1200);
}

/* ===== DESFAZER ===== */
function desfazer(){
if(seq.length===0) return;

seq.pop();
linha.removeChild(linha.lastChild);

sinal=null;
gale=0;
result.innerHTML="⏸️ AGUARDAR";
}

/* ===== MATRIX ===== */
const canvas=document.getElementById("matrix");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

const letters="01アイウエオ";
const fontSize=14;
let drops=Array(Math.floor(window.innerWidth/fontSize)).fill(1);

function drawMatrix(){
ctx.fillStyle="rgba(2,6,23,0.3)";
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="#ff0033";
ctx.font=fontSize+"px monospace";

for(let i=0;i<drops.length;i++){
let text=letters[Math.random()*letters.length|0];
ctx.fillText(text,i*fontSize,drops[i]*fontSize);

if(drops[i]*fontSize>canvas.height && Math.random()>0.975){
drops[i]=0;
}
drops[i]++;
}
}
setInterval(drawMatrix,50);

</script>

</body>
</html>
