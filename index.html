<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SISTEMA I.A - Double Blaze</title>

<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}

body{
background:#020617;
font-family:Arial;
color:#e5e7eb;
overflow:hidden
}

canvas{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:0
}

#app{
position:relative;
z-index:2;
max-width:420px;
height:100vh;
margin:auto;
padding:6px;
display:flex;
flex-direction:column;
gap:6px;
text-align:center
}

.titulo{font-size:20px;font-weight:900;color:#00aaff}
.versao{font-size:13px;font-weight:900;color:#00aaff}

#linha{
display:flex;
gap:4px;
overflow-x:auto;
font-size:16px;
padding:4px
}

#result{
min-height:60px;
font-size:14px;
font-weight:bold
}

.green-chamativo{
font-size:26px;
font-weight:900;
color:#00ff55;
text-shadow:0 0 20px #00ff55
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div id="app">

<div>
<div class="titulo">SISTEMA I.A</div>
<div class="versao">AUTO PRO</div>
<div id="hora"></div>
</div>

<div id="linha"></div>

<div id="result">⏸️ CONECTANDO...</div>

</div>

<script>

/* MATRIX */
const canvas=document.getElementById("matrix")
const ctx=canvas.getContext("2d")
canvas.width=window.innerWidth
canvas.height=window.innerHeight

const letters="01アイウエオ"
const fontSize=14
const columns=canvas.width/fontSize
const drops=[]

for(let x=0;x<columns;x++){drops[x]=1}

function draw(){
ctx.fillStyle="rgba(2,6,23,0.15)"
ctx.fillRect(0,0,canvas.width,canvas.height)

ctx.fillStyle="#00aaff"
ctx.font=fontSize+"px monospace"

for(let i=0;i<drops.length;i++){
const text=letters[Math.floor(Math.random()*letters.length)]
ctx.fillText(text,i*fontSize,drops[i]*fontSize)

if(drops[i]*fontSize>canvas.height && Math.random()>0.975){
drops[i]=0
}
drops[i]++
}
}
setInterval(draw,33)

/* SISTEMA AUTOMÁTICO */

const result = document.getElementById("result")
const linha = document.getElementById("linha")

// 🔥 MUITO IMPORTANTE → TROQUE PELO SEU IP SE PRECISAR
const API = "http://127.0.0.1:3000/api/signal"

async function atualizarSinal(){
  try{
    const res = await fetch(API)
    const data = await res.json()

    linha.innerHTML=""

    data.last.forEach(r=>{
      let el=document.createElement("span")

      if(r.roll === 0) el.innerText="⚪"
      else if(r.roll <= 7) el.innerText="🔴"
      else el.innerText="⚫"

      linha.appendChild(el)
    })

    if(data.signal){

      let cor = data.signal.color === "red" ? "🔴" : "⚫"

      result.innerHTML = `
      <div class="green-chamativo">
        📡 ENTRADA ${cor}<br>
        ♻️ ATÉ G1<br>
        ⚪ PROTEÇÃO
      </div>
      `

    } else {
      result.innerHTML = "⏸️ AGUARDANDO PADRÃO..."
    }

  }catch(e){
    result.innerHTML = "❌ ERRO CONEXÃO"
  }
}

setInterval(atualizarSinal,3000)
atualizarSinal()

/* HORA */
function atualizarHora(){
let agora=new Date(new Date().toLocaleString("en-US",{timeZone:"America/Sao_Paulo"}))
hora.innerText="🕒 "+agora.toLocaleTimeString("pt-BR")
}
setInterval(atualizarHora,1000)

</script>

</body>
</html>
