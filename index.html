<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SISTEMA I.A - Double Blaze</title>

<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}

body{
background:#020617;
font-family:Arial;
color:#e5e7eb;
overflow:hidden
}

canvas{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:0
}

#app{
position:relative;
z-index:2;
max-width:420px;
height:100vh;
margin:auto;
padding:6px;
display:flex;
flex-direction:column;
gap:6px;
text-align:center
}

.titulo{font-size:20px;font-weight:900;color:#00aaff}
.versao{font-size:13px;font-weight:900;color:#00aaff}

#placar{
display:flex;
justify-content:space-between;
font-size:11px
}

.green-neon{color:#22c55e}
.red-neon{color:#ef4444}
.white-neon{color:#facc15}

#linha{
display:flex;
gap:4px;
overflow-x:auto;
font-size:16px;
padding:4px
}

#botoes{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:4px
}

button{
padding:6px;
font-size:11px;
font-weight:bold;
border:none;
border-radius:8px
}

.red{background:#7f1d1d;color:#fff}
.black{background:#020617;color:#fff;border:1px solid #555}
.white{background:#fff;color:#020617}

#result{
min-height:40px;
font-size:13px;
font-weight:bold
}

.green-chamativo{
font-size:28px;
font-weight:900;
color:#00ff55;
text-shadow:0 0 20px #00ff55
}

/* TELAS */
#desempenho,#lista{
position:fixed;
top:0;left:0;width:100%;height:100%;
background:#020617;
z-index:999;
display:none;
flex-direction:column;
align-items:center;
justify-content:center;
overflow:auto
}

/* GRID */
.grade{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:8px;
padding:10px;
width:100%;
}

/* CARD GRANDE */
.card{
border-radius:10px;
height:70px;
display:flex;
flex-direction:column;
overflow:hidden;
}

.card.red{background:#ef4444;color:#fff}
.card.black{background:#111;color:#fff}
.card.white{background:#f1f1f1;color:#000}

.hora{
width:100%;
text-align:center;
font-size:13px;
font-weight:900;
padding:4px 0;
background:rgba(0,0,0,0.3);
}

.cor{
flex:1;
display:flex;
align-items:center;
justify-content:center;
font-size:18px;
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div id="app">

<div>
<div class="titulo">SISTEMA I.A</div>
<div class="versao">V:10 PRO</div>
<div id="hora"></div>
</div>

<div id="placar">
<span class="green-neon">GREEN <b id="greens">0</b></span>
<span class="red-neon">LOSS <b id="losses">0</b></span>
<span class="white-neon">BRANCO <b id="brancos">0</b></span>
</div>

<div id="linha"></div>

<div id="botoes">
<button class="red" onclick="add('R')">🔴</button>
<button class="black" onclick="add('B')">⚫</button>
<button class="white" onclick="add('W')">⚪</button>
</div>

<div id="result">⏸️ AGUARDAR</div>

<button onclick="abrirDesempenho()">📊 Meu Desempenho</button>

</div>

<!-- DESEMPENHO -->
<div id="desempenho">
<h2>📊 DESEMPENHO</h2>

<button onclick="verLista('sg')">🟢 Green SG</button>
<button onclick="verLista('g1')">♻️ Green G1</button>
<button onclick="verLista('loss')">🔴 Loss</button>
<button onclick="verLista('white')">⚪ Brancos</button>

<button onclick="fecharDesempenho()">Fechar</button>
</div>

<!-- LISTA -->
<div id="lista">
<h2 id="tituloLista"></h2>
<div id="conteudoLista" class="grade"></div>
<button onclick="fecharLista()">Voltar</button>
</div>

<script>

/* MATRIX */
const canvas=document.getElementById("matrix")
const ctx=canvas.getContext("2d")
canvas.width=window.innerWidth
canvas.height=window.innerHeight

const letters="01アイウエオ"
const fontSize=14
const columns=canvas.width/fontSize
const drops=[]

for(let x=0;x<columns;x++){drops[x]=1}

function draw(){
ctx.fillStyle="rgba(2,6,23,0.15)"
ctx.fillRect(0,0,canvas.width,canvas.height)

ctx.fillStyle="#00aaff"
ctx.font=fontSize+"px monospace"

for(let i=0;i<drops.length;i++){
const text=letters[Math.floor(Math.random()*letters.length)]
ctx.fillText(text,i*fontSize,drops[i]*fontSize)

if(drops[i]*fontSize>canvas.height && Math.random()>0.975){
drops[i]=0
}
drops[i]++
}
}
setInterval(draw,33)

/* SISTEMA */
const greensEl = document.getElementById("greens")
const lossesEl = document.getElementById("losses")
const brancosEl = document.getElementById("brancos")
const linha = document.getElementById("linha")
const result = document.getElementById("result")

let greens=0
let losses=0
let brancos=0

let seq=[]
let sinal=null
let gale=0

let historico=[]

function salvarDados(){
localStorage.setItem("roboBlaze", JSON.stringify({
greens,losses,brancos,historico
}))
}

function carregarDados(){
let d=JSON.parse(localStorage.getItem("roboBlaze"))
if(!d)return

greens=d.greens||0
losses=d.losses||0
brancos=d.brancos||0
historico=d.historico||[]

greensEl.innerText=greens
lossesEl.innerText=losses
brancosEl.innerText=brancos
}

carregarDados()

/* limpa linha sempre */
seq=[]
linha.innerHTML=""

function registrar(tipo,cor,galeUsado){
historico.push({
tipo,
cor,
hora:new Date().toLocaleTimeString("pt-BR"),
gale:galeUsado
})
salvarDados()
}

function add(c){

seq.push(c)

let el=document.createElement("span")
el.innerText=c==="R"?"🔴":c==="B"?"⚫":"⚪"
linha.appendChild(el)
linha.scrollLeft=linha.scrollWidth

if(sinal){

if(c==="W"){
greens++; brancos++
greensEl.innerText=greens
brancosEl.innerText=brancos

registrar("green","W",gale)

result.innerHTML="<div class='green-chamativo'>⚪🟢 GREEN BRANCO</div>"
resetar()
return
}

if(c === sinal){
greens++
greensEl.innerText=greens

registrar("green",sinal,gale)

result.innerHTML="<div class='green-chamativo'>🟢 GREEN</div>"
resetar()
return
}else{

if(gale===0){
gale=1
result.innerHTML="♻️ ENTRAR G1"
return
}else{
losses++
lossesEl.innerText=losses

registrar("loss",sinal,gale)

result.innerHTML="❌ LOSS"
resetar()
return
}

}
}

// 🔥 SUA LÓGICA ORIGINAL DE SINAL
if(seq.length < 6) return

let entrada = seq[seq.length-6]

if(seq.slice(-3).includes("W")) return
if(entrada==="W") return

sinal = entrada

let ultimos10 = seq.slice(-10)
let ultimos6 = seq.slice(-6)
let ultimos5 = seq.slice(-5)
let ultimos4 = seq.slice(-4)

let gatilhoBranco = ultimos10.includes("W")

let zigzag = ultimos6.join("") === "RBRBRB" || ultimos6.join("") === "BRBRBR"

let repeticaoLonga =
ultimos5.every(c => c === "R") || ultimos5.every(c => c === "B")

let finalLinha =
ultimos4[0] === ultimos4[1] &&
ultimos4[1] === ultimos4[2] &&
ultimos4[2] !== ultimos4[3]

let padraoBranco = gatilhoBranco && (zigzag || repeticaoLonga || finalLinha)

let brancoForte = sinal && padraoBranco

result.innerHTML =
"📡 SINAL<br>Apostar " +
(sinal==="R"?"🔴":"⚫") +
"<br>♻️ Até G1<br>⚪ Proteção Branco" +
(brancoForte ? " <b>(SINAL FORTE)</b>" : "")

}

function resetar(){
sinal=null
gale=0
}

/* DESEMPENHO */
function abrirDesempenho(){desempenho.style.display="flex"}
function fecharDesempenho(){desempenho.style.display="none"}

function verLista(tipo){

desempenho.style.display="none"
lista.style.display="flex"

let listaFiltrada=historico.filter(h=>{
if(tipo==="sg") return h.tipo==="green" && h.gale===0 && h.cor!=="W"
if(tipo==="g1") return h.tipo==="green" && h.gale===1 && h.cor!=="W"
if(tipo==="loss") return h.tipo==="loss"
if(tipo==="white") return h.cor==="W"
})

conteudoLista.innerHTML=""

listaFiltrada.reverse().forEach(i=>{

let corClasse = i.cor==="R"?"red":i.cor==="B"?"black":"white"

conteudoLista.innerHTML += `
<div class="card ${corClasse}">
<div class="hora">${i.hora}</div>
<div class="cor">${i.cor==="R"?"🔴":i.cor==="B"?"⚫":"⚪"}</div>
</div>
`
})

tituloLista.innerText=tipo.toUpperCase()
}

function fecharLista(){
lista.style.display="none"
desempenho.style.display="flex"
}

/* HORA */
function atualizarHora(){
let agora=new Date(new Date().toLocaleString("en-US",{timeZone:"America/Sao_Paulo"}))
hora.innerText="🕒 "+agora.toLocaleTimeString("pt-BR")
}
setInterval(atualizarHora,1000)

</script>

</body>
</html>
