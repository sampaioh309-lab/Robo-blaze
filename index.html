<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SISTEMA I.A - Double Blaze</title>

<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{background:#020617;font-family:Arial;color:#e5e7eb;overflow:hidden}

canvas{position:fixed;inset:0;z-index:0}

#app{
position:relative;
z-index:1;
max-width:420px;
height:100vh;
margin:auto;
padding:6px;
display:flex;
flex-direction:column;
gap:6px;
text-align:center;
}

.titulo{font-size:20px;font-weight:900;color:#ff0033}

#placar{display:flex;justify-content:space-between;font-size:12px;}
.green-neon{color:#22c55e}
.red-neon{color:#ef4444}
.white-neon{color:#facc15}

#linha{display:flex;gap:4px;overflow-x:auto;font-size:18px;padding:4px;}
#linha::-webkit-scrollbar{display:none}

#botoes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
button{padding:10px;font-size:16px;font-weight:bold;border:none;border-radius:10px;}

.red{background:#7f1d1d;color:#fff}
.black{background:#020617;color:#fff;border:1px solid #555}
.white{background:#fff;color:#020617}
.undo{background:#444;color:#fff}

#result{min-height:50px;font-size:15px;font-weight:bold}

/* PAINEL BRANCO RESPONSIVO */
#brancoBox{
position:fixed;
bottom:10px;
left:5px;
right:5px;
background:#020617;
border:1px solid #facc15;
padding:10px;
border-radius:10px;
font-size:13px;
color:#facc15;
display:none;
max-height:120px;
overflow-y:auto;
}

@keyframes pulseGlow{
0%{transform:scale(1)}
50%{transform:scale(1.2)}
100%{transform:scale(1)}
}

.neon{animation:pulseGlow 0.8s infinite;font-weight:900}

.green-big{color:#00ff55;font-size:34px}
.red-big{color:#ff0033;font-size:34px}
.white-big{color:#00ffcc;font-size:34px}

.last-ball{animation:pulseGlow 0.6s infinite}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div id="app">

<div class="titulo">SISTEMA I.A</div>

<div id="placar">
<span class="green-neon">GREEN <b id="greens">0</b></span>
<span class="red-neon">LOSS <b id="losses">0</b></span>
<span class="white-neon">BRANCO <b id="brancos">0</b></span>
</div>

<div id="linha"></div>

<div id="botoes">
<button class="red" onclick="add('R')">🔴</button>
<button class="black" onclick="add('B')">⚫</button>
<button class="white" onclick="add('W')">⚪</button>
<button class="undo" onclick="desfazer()">↩️</button>
</div>

<div id="result">⏸️ AGUARDAR</div>
<div id="brancoBox"></div>

</div>

<script>

let seq=[], sinal=null, gale=0;
let greens=0, losses=0, brancos=0;
let janelaBranco=null;

const linha=document.getElementById("linha");
const result=document.getElementById("result");
const brancoBox=document.getElementById("brancoBox");

const greensEl=document.getElementById("greens");
const lossesEl=document.getElementById("losses");
const brancosEl=document.getElementById("brancos");

function atualizarPlacar(){
greensEl.innerText=greens;
lossesEl.innerText=losses;
brancosEl.innerText=brancos;
}

/* GERAR HORÁRIOS */
function gerarHorariosBranco(){

let agora=new Date();
let base=new Date(agora.getTime()+5*60000);

let horarios=[];

for(let i=0;i<4;i++){
let t=new Date(base.getTime()+i*3*60000);
horarios.push(t);
}

/* janela ±1 min */
let inicio=new Date(horarios[0].getTime()-60000);
let fim=new Date(horarios[3].getTime()+60000);

janelaBranco={
inicio:inicio.getTime(),
fim:fim.getTime()
};

return horarios.map(h=>`${h.getHours()}:${h.getMinutes().toString().padStart(2,'0')}`);
}

function add(c){

document.querySelectorAll("#linha span").forEach(e=>e.classList.remove("last-ball"));

const el=document.createElement("span");
el.innerText=c==="R"?"🔴":c==="B"?"⚫":"⚪";
el.classList.add("last-ball");

linha.appendChild(el);
linha.scrollLeft=linha.scrollWidth;

seq.push(c);

/* 🔥 TRATAMENTO DO BRANCO */
if(c==="W"){

let agora = Date.now();

/* 🟡 GREEN POR HORÁRIO */
if(janelaBranco && agora >= janelaBranco.inicio && agora <= janelaBranco.fim){
greens++;
brancos++;

result.innerHTML = "<div class='neon white-big'>⚪ GREEN (HORÁRIO)</div>";

atualizarPlacar();
janelaBranco = null;
brancoBox.style.display = "none";

sinal = null;
gale = 0;
return;
}

/* 🟢 GREEN POR PROTEÇÃO */
if(sinal){
validar("W");
return;
}

/* ⚪ BRANCO NORMAL */
let horarios = gerarHorariosBranco();

brancoBox.style.display = "block";
brancoBox.innerHTML = `
⚪ <b>Possíveis Brancos</b><br>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:5px;">
${horarios.map(h=>`<div>🕒 ${h}</div>`).join("")}
</div>
`;

brancos++;
atualizarPlacar();
return;
}

/* fluxo normal */
if(sinal){
validar(c);
}else{
analisar();
}
}

/* ESTRATÉGIA */
function analisar(){

if(seq.length < 6){
result.innerHTML="⏸️ Aguardando dados...";
return;
}

let entrada=seq[seq.length-6];

if(entrada==="W"){
result.innerHTML="⚠️ Entrada inválida";
return;
}

if(seq.slice(-3).includes("W")){
result.innerHTML="⚠️ Branco recente";
return;
}

sinal=entrada;

result.innerHTML=`
📡 Padrão detectado<br>
🎯 ${sinal==="R"?"🔴":"⚫"} + ⚪<br>
♻️ Até G1
`;
}

/* VALIDAÇÃO */
function validar(c){

/* 🔥 BRANCO = GREEN + BRANCO */
if(c==="W"){
greens++;
brancos++;

result.innerHTML="<div class='neon white-big'>⚪ GREEN</div>";

atualizarPlacar();
sinal=null;
gale=0;
return;
}

/* GREEN NORMAL */
if(c===sinal){
greens++;
result.innerHTML="<div class='neon green-big'>🟢 GREEN</div>";
atualizarPlacar();
sinal=null;
gale=0;
return;
}

/* GALE */
if(gale===0){
gale=1;
result.innerHTML="♻️ G1";
return;
}

/* LOSS */
losses++;
result.innerHTML="<div class='neon red-big'>❌ LOSS</div>";
atualizarPlacar();
sinal=null;
gale=0;
}

/* limpar janela */
setInterval(()=>{
if(janelaBranco && Date.now()>janelaBranco.fim){
janelaBranco=null;
brancoBox.style.display="none";
}
},1000);

/* desfazer */
function desfazer(){
if(seq.length===0) return;

seq.pop();
linha.removeChild(linha.lastChild);

sinal=null;
gale=0;
result.innerHTML="⏸️ AGUARDAR";
}

/* MATRIX */
const canvas=document.getElementById("matrix");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

const letters="01アイウエオ";
const fontSize=14;
let drops=Array(Math.floor(window.innerWidth/fontSize)).fill(1);

function drawMatrix(){
ctx.fillStyle="rgba(2,6,23,0.3)";
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="#ff0033";
ctx.font=fontSize+"px monospace";

for(let i=0;i<drops.length;i++){
let text=letters[Math.random()*letters.length|0];
ctx.fillText(text,i*fontSize,drops[i]*fontSize);

if(drops[i]*fontSize>canvas.height && Math.random()>0.975){
drops[i]=0;
}
drops[i]++;
}
}

setInterval(drawMatrix,50);

</script>

</body>
</html>
